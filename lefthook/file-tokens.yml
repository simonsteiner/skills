# Loaded by repos that take the shared token-budget script from this repo as a
# lefthook remote. It ships .lefthook/pre-commit/check-file-tokens.py (a symlink
# to skills/engineering/setup-lefthook/scripts/); the job and its --max-tokens
# live in each repo's own lefthook.yml. No jobs here: a job defined in a remote
# fails open when the remote can't be fetched, and a repo can't override it.
min_version: 2.0.5 # `args:` on script jobs
