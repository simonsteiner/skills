name: Lint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  skills:
    name: Skills
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check skills against the authoring rules
        run: python3 scripts/lint-skills.py

      - name: Shellcheck
        run: shellcheck scripts/*.sh skills/*/*/scripts/*.sh
