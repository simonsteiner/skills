name: Lint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  skills:
    name: Skills
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check skills against the authoring rules
        run: python3 scripts/lint-skills.py

      # tests/tooling: the scripts/tooling package; tests/skill_scripts: the scripts
      # bundled in skills, against a fake gh.
      - name: Test the tooling and the bundled scripts
        run: python3 -m unittest discover -s tests -t .

      # setup-uv publishes no floating major tag.
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.0

      # Same version as lefthook; config in ruff.toml.
      - name: Ruff
        run: uvx ruff@0.17.0 check scripts tests

      - name: Shellcheck
        run: shellcheck skills/*/*/scripts/*.sh

      # Same version as package.json pins; config in .rumdl.toml.
      - name: Markdown
        run: npx --yes rumdl@0.2.79 check .
