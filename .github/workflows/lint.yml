name: Lint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  skills:
    name: Skills
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check skills against the authoring rules
        run: python3 scripts/lint-skills.py

      - name: Test the tooling
        run: python3 -m unittest discover -s scripts

      - name: Shellcheck
        run: shellcheck scripts/*.sh skills/*/*/scripts/*.sh

      # Same version as package.json pins; config in .rumdl.toml.
      - name: Markdown
        run: npx --yes rumdl@0.2.79 check .
