name: Changelog

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  changelog:
    name: Apply changesets
    runs-on: ubuntu-latest
    # `--ignore-scripts` already skips lefthook's `prepare`; this keeps any hooks off the
    # bot's commit should that ever change.
    env:
      LEFTHOOK: 0
    permissions:
      contents: write
    steps:
      # Check out the current main, not the pushed commit: a run queued behind
      # another would otherwise miss its changelog commit and re-apply its changesets.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Check for pending changesets
        id: pending
        run: |
          if find .changeset -name '*.md' ! -name README.md | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.pending.outputs.found
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # No install scripts: this job holds a token that can push to main, and changesets
      # needs none (the only install script fetches the lefthook binary).
      - name: Install dependencies
        if: steps.pending.outputs.found
        run: npm ci --ignore-scripts

      # Pushes straight to main rather than opening a version PR. A push made with
      # GITHUB_TOKEN doesn't trigger workflows, so this doesn't re-run itself.
      - name: Write CHANGELOG.md and push
        if: steps.pending.outputs.found
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx changeset version
          npm install --package-lock-only --ignore-scripts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: update changelog"
          git pull --rebase origin main
          git push origin HEAD:main
