# Ref: https://github.com/evilmartians/lefthook
# Installed by `npm install` (the `prepare` script); by hand: npx lefthook install

pre-commit:
  parallel: true
  commands:
    # Rebuilds the skill catalogs (README.md, bucket READMEs, plugin.json, and
    # third-party/README.md) and stages the files it rewrote, then lints the whole repo, not just
    # the staged files: the rules cross files (links, shared trigger phrases). One
    # job, so the lint never reads a catalog the build is still writing. Same lint as CI.
    lint-skills:
      glob: "{skills/**,third-party/**,README.md,.claude-plugin/**,scripts/*.py,scripts/**/*.py,pyproject.toml,uv.lock}"
      run: >-
        out=$(uv run --locked --no-build python3 scripts/build-catalog.py) &&
        printf '%s\n' "$out" | sed -n 's/^wrote //p' | xargs -r git add &&
        uv run --locked --no-build python3 scripts/lint-skills.py

    # Same as CI: the tooling, the scripts bundled in skills against a fake gh, and the skills' prose.
    tests:
      glob: "{scripts/*.py,scripts/**/*.py,tests/*.py,tests/**/*.py,skills/**,.lefthook/**,pyproject.toml,uv.lock}"
      run: uv run --locked --no-build python3 -m unittest discover -s tests -t .

    # Same as CI: every staged file an agent writes stays under 5,000 tokens (bytes / 4),
    # so an agent can read it whole. The setup-lefthook skill's script, run from here
    # rather than through the remote other repos use; tool-written files are marked
    # linguist-generated in .gitattributes.
    file-tokens:
      run: python3 skills/engineering/setup-lefthook/scripts/check-file-tokens.py --max-tokens 5000 {staged_files}

    # Same as CI: no em or en dashes in the staged files. The setup-lefthook skill's
    # script, run from here rather than through the remote other repos use.
    dashes:
      run: python3 skills/engineering/setup-lefthook/scripts/check-dashes.py {staged_files}

    # Same as CI's Ruff step; bump the version in both places.
    ruff:
      glob: "*.py"
      run: uvx ruff@0.17.0 check {staged_files}

    # Same as CI's Shellcheck step.
    shellcheck:
      glob: "*.sh"
      run: shellcheck {staged_files}

    # Hardcoded secrets in the staged files, plus new dependency risks when
    # package.json or its lockfile changes, scanned by the SonarQube CLI against
    # the SonarCloud project. Skipped on a machine without `sonar` or not logged
    # in (`sonar auth login`, or SONARQUBE_CLI_TOKEN with SONARQUBE_CLI_ORG);
    # SonarCloud's PR analysis stays the gate.
    sonar:
      skip:
        - run: "! command -v sonar >/dev/null || ! sonar auth status >/dev/null 2>&1"
      run: sonar hook git-pre-commit --dependency-risks -p simonsteiner_skills {staged_files}

    # The only fixer of *.md. Config and excludes in .rumdl.toml; an excluded
    # staged file is skipped, not an error.
    rumdl:
      glob: "*.md"
      run: npx rumdl check --fix {staged_files}
      stage_fixed: true
