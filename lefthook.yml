# Ref: https://github.com/evilmartians/lefthook
# Installed by `npm install` (the `prepare` script); by hand: npx lefthook install

pre-commit:
  parallel: true
  commands:
    # Whole repo, not just the staged files: the rules cross files (README and
    # plugin.json entries, links, shared trigger phrases). Same check as CI.
    lint-skills:
      glob: "{skills/**,third-party/**,README.md,.claude-plugin/**,scripts/*.py,scripts/**/*.py}"
      run: python3 scripts/lint-skills.py

    # Same as CI: the tooling, and the scripts bundled in skills against a fake gh.
    tests:
      glob: "{scripts/*.py,scripts/**/*.py,tests/*.py,tests/**/*.py,skills/*/*/scripts/*,.lefthook/**}"
      run: python3 -m unittest discover -s tests -t .

    # Same as CI's Ruff step; bump the version in both places.
    ruff:
      glob: "*.py"
      run: uvx ruff@0.17.0 check {staged_files}

    # Same as CI's Shellcheck step.
    shellcheck:
      glob: "*.sh"
      run: shellcheck {staged_files}

    # Hardcoded secrets in the staged files, plus new dependency risks when
    # package.json or its lockfile changes, scanned by the SonarQube CLI against
    # the SonarCloud project. Skipped on a machine without `sonar` or not logged
    # in (`sonar auth login`, or SONARQUBE_CLI_TOKEN with SONARQUBE_CLI_ORG);
    # SonarCloud's PR analysis stays the gate.
    sonar:
      skip:
        - run: "! command -v sonar >/dev/null || ! sonar auth status >/dev/null 2>&1"
      run: sonar hook git-pre-commit --dependency-risks -p simonsteiner_skills {staged_files}

    # The only fixer of *.md. Config and excludes in .rumdl.toml; an excluded
    # staged file is skipped, not an error.
    rumdl:
      glob: "*.md"
      run: npx rumdl check --fix {staged_files}
      stage_fixed: true
